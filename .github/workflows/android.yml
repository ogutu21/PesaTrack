name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle -p android assembleDebug
      - run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA1"
      - uses: actions/upload-artifact@v4
        with: { name: PesaTrack-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
